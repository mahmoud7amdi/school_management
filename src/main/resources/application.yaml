spring:
  application:
    name: school-management-api

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/school_db?createDatabaseIfNotExist=true
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: true
    mode: HTML

server:
  port: 8080
