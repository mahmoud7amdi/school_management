<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add User')}"></head>
<body>

<div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: mobileNav}"></div>

    <div id="content" class="position-relative h-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>

        <div class="custom-container">
            <div class="page-header">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/dashboard/users/all}" class="text-secondary">Users</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Add</li>
                        </ol>
                    </nav>
                    <h1>Add New User</h1>
                </div>
                <a th:href="@{/dashboard/users/all}" class="btn btn-light">
                    <i class="ti ti-arrow-left me-1"></i> Back to Users
                </a>
            </div>

            <div class="card form-card shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <div id="alertContainer"></div>
                    <form id="addUserForm" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="username">Username</label>
                                <input type="text" id="username" class="form-control" required minlength="3" />
                                <div class="invalid-feedback">Please enter a username (3+ characters).</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" class="form-control" required />
                                <div class="invalid-feedback">Please enter a valid email.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" id="password" class="form-control" required minlength="6" />
                                <div class="invalid-feedback">Password must be at least 6 characters.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="role">Role</label>
                                <select id="role" class="form-select" required>
                                    <option value="" selected disabled>Select role</option>
                                </select>
                                <div class="invalid-feedback">Please choose a role.</div>
                            </div>
                            <div class="col-12" id="schoolSelectContainer" style="display: none;">
                                <label class="form-label" for="schoolId">School</label>
                                <select id="schoolId" class="form-select">
                                    <option value="" selected disabled>Select school</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary" id="saveBtn">
                                <i class="ti ti-check me-1"></i> Save User
                            </button>
                            <a th:href="@{/dashboard/users/all}" class="btn btn-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/assets/js/users.js}"></script>

</body>
</html>
