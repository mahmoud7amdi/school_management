<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add User')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/users/all}" class="text-secondary">Users</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Add</li>
                    </ol>
                </nav>
                <h1>Add New User</h1>
            </div>
            <a th:href="@{/dashboard/users/all}" class="btn btn-light">
                <i class="ti ti-arrow-left me-1"></i> Back to Users
            </a>
        </div>

        <div class="card form-card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <form id="addUserForm" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="fullName">Full name <span class="text-danger">*</span></label>
                            <input type="text" id="fullName" name="fullName" class="form-control" maxlength="120" required autofocus />
                            <div class="invalid-feedback" data-server-feedback>Please enter the full name.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="username">Username <span class="text-danger">*</span></label>
                            <input type="text" id="username" name="username" class="form-control"
                                   minlength="3" maxlength="50" autocomplete="off" required />
                            <div class="invalid-feedback" data-server-feedback>Username must be 3+ characters.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
                            <input type="email" id="email" name="email" class="form-control" maxlength="150" required />
                            <div class="invalid-feedback" data-server-feedback>Please enter a valid email.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="password">Password <span class="text-danger">*</span></label>
                            <input type="password" id="password" name="password" class="form-control"
                                   minlength="6" maxlength="100" autocomplete="new-password" required />
                            <div class="invalid-feedback" data-server-feedback>Password must be at least 6 characters.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="role">Role <span class="text-danger">*</span></label>
                            <select id="role" name="role" class="form-select" required></select>
                            <div class="invalid-feedback" data-server-feedback>Please choose a role.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phoneNumber">Phone</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" maxlength="30" />
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                        <!-- Shown only for a super admin: a school admin's users join their own school. -->
                        <div class="col-12 d-none" id="schoolField">
                            <label class="form-label" for="schoolId">School <span class="text-danger">*</span></label>
                            <select id="schoolId" name="schoolId" class="form-select"></select>
                            <div class="invalid-feedback" data-server-feedback>Please select a school.</div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <i class="ti ti-check me-1"></i> Save User
                        </button>
                        <a th:href="@{/dashboard/users/all}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/user-form.js}"></script>

</body>
</html>
