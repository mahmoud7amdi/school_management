<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Profile</li>
                    </ol>
                </nav>
                <h1>My Profile</h1>
            </div>
            <a th:href="@{/dashboard/index}" class="btn btn-light">
                <i class="ti ti-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>

        <div class="row g-4">
            <!-- Identity summary -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center p-4">
                        <img th:src="@{/assets/images/avatar/avatar-fallback.jpg}" alt=""
                             class="avatar avatar-xl rounded-circle mb-3 user-avatar" width="96" height="96" />
                        <h5 class="mb-0 user-full-name">&nbsp;</h5>
                        <p class="text-secondary small mb-2 user-username"></p>
                        <span class="badge bg-primary-subtle text-primary-emphasis user-role-badge"></span>
                        <hr />
                        <dl class="row mb-0 text-start small">
                            <dt class="col-5 text-secondary fw-normal">School</dt>
                            <dd class="col-7 fw-semibold school-name">&mdash;</dd>
                            <dt class="col-5 text-secondary fw-normal">Member since</dt>
                            <dd class="col-7 fw-semibold" id="memberSince">&mdash;</dd>
                        </dl>
                    </div>
                </div>
            </div>

            <!-- Editable details -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0">Account details</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="profileForm" class="needs-validation" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="fullName">Full name <span class="text-danger">*</span></label>
                                    <input type="text" id="fullName" name="fullName" class="form-control" maxlength="120" required />
                                    <div class="invalid-feedback" data-server-feedback>Please enter your full name.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="username">Username <span class="text-danger">*</span></label>
                                    <input type="text" id="username" name="username" class="form-control"
                                           minlength="3" maxlength="50" required />
                                    <div class="invalid-feedback" data-server-feedback>Username must be 3+ characters.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
                                    <input type="email" id="email" name="email" class="form-control" maxlength="150" required />
                                    <div class="invalid-feedback" data-server-feedback>Please enter a valid email.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="phoneNumber">Phone</label>
                                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" maxlength="30" />
                                    <div class="invalid-feedback" data-server-feedback></div>
                                </div>
                            </div>

                            <div class="form-section">
                                <p class="form-section-title">Change password</p>
                                <p class="text-secondary small">
                                    Leave these blank to keep your current password.
                                </p>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="currentPassword">Current password</label>
                                        <input type="password" id="currentPassword" name="currentPassword"
                                               class="form-control" autocomplete="current-password" />
                                        <div class="invalid-feedback" data-server-feedback></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="newPassword">New password</label>
                                        <input type="password" id="newPassword" name="newPassword" class="form-control"
                                               minlength="6" maxlength="100" autocomplete="new-password" />
                                        <div class="invalid-feedback" data-server-feedback>Must be at least 6 characters.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary" id="saveBtn">
                                    <i class="ti ti-check me-1"></i> Save Changes
                                </button>
                                <a th:href="@{/dashboard/index}" class="btn btn-light">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/profile.js}"></script>

</body>
</html>
