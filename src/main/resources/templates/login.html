<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Sign in | School Management</title>

    <link rel="apple-touch-icon" sizes="57x57" th:href="@{/assets/images/favicon/apple-icon-57x57.png}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/images/favicon/favicon-32x32.png}" />
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/assets/images/favicon/favicon-16x16.png}" />

    <script th:src="@{/assets/js/vendors/color-modes.js}"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" />
    <link rel="stylesheet" th:href="@{/assets/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/app.css}" />
</head>

<body>
<main class="container d-flex flex-column h-100">
    <div class="row align-items-center justify-content-center g-0 min-vh-100">
        <div class="col-12 col-md-8 col-lg-6 col-xxl-4 py-8 py-xl-0">
            <div class="card shadow-sm">
                <div class="card-body p-6">
                    <div class="mb-4 text-center">
                        <a th:href="@{/}">
                            <img th:src="@{/assets/images/brand/logo/school-logo.svg}" class="mb-2" alt="School Management" width="48" height="48" />
                        </a>
                        <h1 class="mb-1 fw-bold fs-3">Sign in</h1>
                        <p class="text-secondary mb-0">Welcome back. Enter your details to continue.</p>
                    </div>

                    <form id="loginForm" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" name="username" class="form-control"
                                   placeholder="Enter your username" autocomplete="username" required autofocus />
                            <div class="invalid-feedback">Please enter your username.</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="password-field position-relative">
                                <input type="password" id="password" name="password"
                                       class="form-control fakePassword" placeholder="Enter your password"
                                       autocomplete="current-password" required />
                                <span><i class="ti ti-eye-off passwordToggler" role="button" aria-label="Show password"></i></span>
                                <div class="invalid-feedback">Please enter your password.</div>
                            </div>
                        </div>

                        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
                        </div>
                    </form>

                    <p class="text-center text-secondary small mt-4 mb-0">
                        <a th:href="@{/about}" class="text-decoration-none">About us</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/assets/js/vendors/password.js}"></script>
<script th:src="@{/assets/js/core/api.js}"></script>
<script th:src="@{/assets/js/pages/login.js}"></script>
</body>
</html>
