<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add School')}"></head>
<body>

<div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: mobileNav}"></div>

    <div id="content" class="position-relative h-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>

        <div class="custom-container">
            <div class="page-header">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/dashboard/schools/all}" class="text-secondary">Schools</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Add</li>
                        </ol>
                    </nav>
                    <h1>Add New School</h1>
                </div>
                <a th:href="@{/dashboard/schools/all}" class="btn btn-light">
                    <i class="ti ti-arrow-left me-1"></i> Back to Schools
                </a>
            </div>

            <div class="card form-card shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <div id="alertContainer"></div>
                    <form id="addSchoolForm" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="name">School Name</label>
                                <input type="text" id="name" class="form-control" required />
                                <div class="invalid-feedback">Please enter the school name.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" class="form-control" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="phoneNumber">Phone Number</label>
                                <input type="text" id="phoneNumber" class="form-control" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="website">Website</label>
                                <input type="url" id="website" class="form-control" placeholder="https://" />
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="address">Address</label>
                                <input type="text" id="address" class="form-control" />
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary" id="saveBtn">
                                <i class="ti ti-check me-1"></i> Save School
                            </button>
                            <a th:href="@{/dashboard/schools/all}" class="btn btn-light">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/assets/js/schools.js}"></script>

</body>
</html>
