<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add School')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/schools/all}" class="text-secondary">Schools</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Add</li>
                    </ol>
                </nav>
                <h1>Add New School</h1>
            </div>
            <a th:href="@{/dashboard/schools/all}" class="btn btn-light">
                <i class="ti ti-arrow-left me-1"></i> Back to Schools
            </a>
        </div>

        <div class="card form-card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <form id="addSchoolForm" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="name">School name <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name" class="form-control" maxlength="150" required autofocus />
                            <div class="invalid-feedback" data-server-feedback>Please enter the school name.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-control" maxlength="150" />
                            <div class="invalid-feedback" data-server-feedback>Please enter a valid email.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phoneNumber">Phone</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" maxlength="30" />
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="website">Website</label>
                            <input type="url" id="website" name="website" class="form-control"
                                   placeholder="https://example.com" maxlength="255" />
                            <div class="invalid-feedback" data-server-feedback>Must start with http:// or https://</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="address">Address</label>
                            <input type="text" id="address" name="address" class="form-control" maxlength="255" />
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <i class="ti ti-check me-1"></i> Save School
                        </button>
                        <a th:href="@{/dashboard/schools/all}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/school-form.js}"></script>

</body>
</html>
