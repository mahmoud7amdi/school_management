<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Schools')}"></head>
<body>

<div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: mobileNav}"></div>

    <div id="content" class="position-relative h-100">
        <div th:replace="~{fragments/layout :: topbar}"></div>

        <div class="custom-container">
            <div class="page-header">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Schools</li>
                        </ol>
                    </nav>
                    <h1>All Schools</h1>
                </div>
                <div class="d-flex gap-2">
                    <div class="input-group input-group-sm" style="max-width: 260px;">
                        <span class="input-group-text bg-transparent"><i class="ti ti-search"></i></span>
                        <input type="text" id="schoolSearch" class="form-control" placeholder="Search schools..." />
                    </div>
                    <a th:href="@{/dashboard/schools/add}" class="btn btn-primary">
                        <i class="ti ti-plus me-1"></i> Add School
                    </a>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table app-table mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Address</th>
                                    <th>Website</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="schoolsTableBody">
                                <tr><td colspan="7" class="table-state"><i class="ti ti-loader-2"></i> Loading schools...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit school modal -->
<div class="modal fade" id="editSchoolModal" tabindex="-1" aria-labelledby="editSchoolModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <form id="editSchoolForm" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="editSchoolModalLabel">Edit School</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="editAlertContainer"></div>
                    <input type="hidden" id="editSchoolId" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="editName">School Name</label>
                            <input type="text" id="editName" class="form-control" required />
                            <div class="invalid-feedback">School name is required.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="editEmail">Email</label>
                            <input type="email" id="editEmail" class="form-control" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="editPhone">Phone</label>
                            <input type="text" id="editPhone" class="form-control" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="editWebsite">Website</label>
                            <input type="url" id="editWebsite" class="form-control" />
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="editAddress">Address</label>
                            <input type="text" id="editAddress" class="form-control" />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="updateSchoolBtn">Update School</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: confirmModal}"></div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/assets/js/schools.js}"></script>

</body>
</html>
