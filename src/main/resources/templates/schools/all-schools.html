<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All Schools')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Schools</li>
                    </ol>
                </nav>
                <h1>Schools</h1>
                <p class="page-subtitle" id="resultSummary">Loading schools...</p>
            </div>
            <a th:href="@{/dashboard/schools/add}" class="btn btn-primary">
                <i class="ti ti-plus me-1"></i> Add School
            </a>
        </div>

        <div class="table-toolbar">
            <div class="toolbar-search">
                <div class="input-group">
                    <span class="input-group-text bg-transparent"><i class="ti ti-search"></i></span>
                    <input type="search" id="schoolSearch" class="form-control"
                           placeholder="Search schools..." aria-label="Search schools" />
                </div>
            </div>
            <div class="toolbar-spacer"></div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table app-table mb-0 align-middle">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Website</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="schoolsTableBody">
                        <tr><td colspan="7" class="table-state"><i class="ti ti-loader-2"></i>Loading schools...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit school -->
<div class="modal fade" id="editSchoolModal" tabindex="-1" aria-labelledby="editSchoolLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <form id="editSchoolForm" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="editSchoolLabel">Edit School</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editSchoolId" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="name">School name <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name" class="form-control" maxlength="150" required />
                            <div class="invalid-feedback" data-server-feedback>School name is required.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-control" maxlength="150" />
                            <div class="invalid-feedback" data-server-feedback>Please enter a valid email.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phoneNumber">Phone</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" maxlength="30" />
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="website">Website</label>
                            <input type="url" id="website" name="website" class="form-control"
                                   placeholder="https://example.com" maxlength="255" />
                            <div class="invalid-feedback" data-server-feedback>Must start with http:// or https://</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="address">Address</label>
                            <input type="text" id="address" name="address" class="form-control" maxlength="255" />
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="active" name="active" />
                                <label class="form-check-label" for="active">School is active</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="updateSchoolBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/schools-list.js}"></script>

</body>
</html>
