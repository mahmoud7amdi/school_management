<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Subject')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/subjects/all}" class="text-secondary">Subjects</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Add</li>
                    </ol>
                </nav>
                <h1>Add New Subject</h1>
            </div>
            <a th:href="@{/dashboard/subjects/all}" class="btn btn-light">
                <i class="ti ti-arrow-left me-1"></i> Back to Subjects
            </a>
        </div>

        <div class="card form-card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <form id="subjectForm" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" for="name">Subject name <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name" class="form-control"
                                   placeholder="e.g. Mathematics" maxlength="100" required autofocus />
                            <div class="invalid-feedback" data-server-feedback>Please enter the subject name.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="code">Code</label>
                            <input type="text" id="code" name="code" class="form-control"
                                   placeholder="e.g. MATH101" maxlength="20" />
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="gradeId">Grade <span class="text-danger">*</span></label>
                            <select id="gradeId" name="gradeId" class="form-select" required></select>
                            <div class="invalid-feedback" data-server-feedback>Please select a grade.</div>
                            <div class="form-text">The school is taken from the grade.</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="weeklyHours">Weekly hours</label>
                            <input type="number" id="weeklyHours" name="weeklyHours" class="form-control" min="1" max="60" />
                            <div class="invalid-feedback" data-server-feedback>Must be between 1 and 60.</div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <i class="ti ti-check me-1"></i> Save Subject
                        </button>
                        <a th:href="@{/dashboard/subjects/all}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/subject-form.js}"></script>

</body>
</html>
