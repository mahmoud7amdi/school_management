<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Subjects')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Subjects</li>
                    </ol>
                </nav>
                <h1>Subjects</h1>
                <p class="page-subtitle" id="resultSummary">Loading...</p>
            </div>
            <a th:href="@{/dashboard/subjects/add}" class="btn btn-primary">
                <i class="ti ti-plus me-1"></i> Add Subject
            </a>
        </div>

        <div class="table-toolbar">
            <div class="toolbar-search">
                <div class="input-group">
                    <span class="input-group-text bg-transparent"><i class="ti ti-search"></i></span>
                    <input type="search" id="searchInput" class="form-control"
                           placeholder="Search subjects..." aria-label="Search subjects" />
                </div>
            </div>
            <div class="toolbar-spacer"></div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table app-table mb-0 align-middle">
                        <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Code</th>
                            <th>Grade</th>
                            <th>Weekly hours</th>
                            <th class="school-col">School</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="tableBody">
                        <tr><td colspan="6" class="table-state"><i class="ti ti-loader-2"></i>Loading subjects...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="editForm" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="editLabel">Edit Subject</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="name">Subject name <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name" class="form-control" maxlength="100" required />
                            <div class="invalid-feedback" data-server-feedback>Please enter a subject name.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="code">Code</label>
                            <input type="text" id="code" name="code" class="form-control" maxlength="20" />
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="weeklyHours">Weekly hours</label>
                            <input type="number" id="weeklyHours" name="weeklyHours" class="form-control" min="1" max="60" />
                            <div class="invalid-feedback" data-server-feedback>Must be between 1 and 60.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="gradeId">Grade <span class="text-danger">*</span></label>
                            <select id="gradeId" name="gradeId" class="form-select" required></select>
                            <div class="invalid-feedback" data-server-feedback>Please select a grade.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="updateBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/subjects-list.js}"></script>

</body>
</html>
