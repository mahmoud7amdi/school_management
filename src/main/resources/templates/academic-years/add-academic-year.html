<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Academic Year')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/academic-years/all}" class="text-secondary">Academic Years</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Add</li>
                    </ol>
                </nav>
                <h1>Add Academic Year</h1>
            </div>
            <a th:href="@{/dashboard/academic-years/all}" class="btn btn-light">
                <i class="ti ti-arrow-left me-1"></i> Back to Academic Years
            </a>
        </div>

        <div class="card form-card shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <form id="academicYearForm" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-12 d-none" id="schoolField">
                            <label class="form-label" for="schoolId">School <span class="text-danger">*</span></label>
                            <select id="schoolId" name="schoolId" class="form-select"></select>
                            <div class="invalid-feedback" data-server-feedback>Please select a school.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="name">Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name" class="form-control"
                                   placeholder="e.g. 2024/2025" maxlength="50" required autofocus />
                            <div class="invalid-feedback" data-server-feedback>Please enter a name.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="startDate">Start date <span class="text-danger">*</span></label>
                            <input type="date" id="startDate" name="startDate" class="form-control" required />
                            <div class="invalid-feedback" data-server-feedback>Please choose a start date.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="endDate">End date <span class="text-danger">*</span></label>
                            <input type="date" id="endDate" name="endDate" class="form-control" required />
                            <div class="invalid-feedback" data-server-feedback>Please choose an end date.</div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="current" name="current" />
                                <label class="form-check-label" for="current">Set as the current academic year</label>
                            </div>
                            <div class="form-text">Any other year for this school stops being current.</div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <i class="ti ti-check me-1"></i> Save Academic Year
                        </button>
                        <a th:href="@{/dashboard/academic-years/all}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/academic-year-form.js}"></script>

</body>
</html>
