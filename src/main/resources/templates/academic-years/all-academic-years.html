<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Academic Years')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Academic Years</li>
                    </ol>
                </nav>
                <h1>Academic Years</h1>
                <p class="page-subtitle" id="resultSummary">Loading...</p>
            </div>
            <a th:href="@{/dashboard/academic-years/add}" class="btn btn-primary">
                <i class="ti ti-plus me-1"></i> Add Academic Year
            </a>
        </div>

        <div class="table-toolbar">
            <div class="toolbar-search">
                <div class="input-group">
                    <span class="input-group-text bg-transparent"><i class="ti ti-search"></i></span>
                    <input type="search" id="searchInput" class="form-control"
                           placeholder="Search academic years..." aria-label="Search academic years" />
                </div>
            </div>
            <div class="toolbar-spacer"></div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table app-table mb-0 align-middle">
                        <thead>
                        <tr>
                            <th>Year</th>
                            <th>Starts</th>
                            <th>Ends</th>
                            <th class="school-col">School</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="tableBody">
                        <tr><td colspan="5" class="table-state"><i class="ti ti-loader-2"></i>Loading academic years...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="editForm" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="editLabel">Edit Academic Year</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="name">Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" name="name" class="form-control"
                                   placeholder="e.g. 2024/2025" maxlength="50" required />
                            <div class="invalid-feedback" data-server-feedback>Please enter a name.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="startDate">Start date <span class="text-danger">*</span></label>
                            <input type="date" id="startDate" name="startDate" class="form-control" required />
                            <div class="invalid-feedback" data-server-feedback>Please choose a start date.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="endDate">End date <span class="text-danger">*</span></label>
                            <input type="date" id="endDate" name="endDate" class="form-control" required />
                            <div class="invalid-feedback" data-server-feedback>Please choose an end date.</div>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="current" name="current" />
                                <label class="form-check-label" for="current">This is the current academic year</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="updateBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/academic-years-list.js}"></script>

</body>
</html>
