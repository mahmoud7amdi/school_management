<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Absence Notes')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Absence Notes</li>
                    </ol>
                </nav>
                <h1 id="pageTitle">Absence Notes</h1>
                <p class="page-subtitle" id="resultSummary">Loading...</p>
            </div>
            <button type="button" class="btn btn-primary" id="newNoteBtn"
                    data-requires-role="STUDENT,PARENT">
                <i class="ti ti-plus me-1"></i> Explain an Absence
            </button>
        </div>

        <!-- Parents pick which child a note belongs to; students have only themselves. -->
        <div class="table-toolbar" id="childPickerWrapper" data-requires-role="PARENT">
            <div class="toolbar-search">
                <label class="form-label small text-secondary mb-1" for="childPicker">Child</label>
                <select id="childPicker" class="form-select" aria-label="Choose a child"></select>
            </div>
            <div class="toolbar-spacer"></div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table app-table mb-0 align-middle">
                        <thead>
                        <tr>
                            <th data-requires-role="TEACHER">Student</th>
                            <th>Date</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Reviewed by</th>
                            <th>Review note</th>
                            <th class="text-end" data-requires-role="TEACHER">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="tableBody">
                        <tr><td colspan="7" class="table-state"><i class="ti ti-loader-2"></i>Loading notes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Submit (student/parent) -->
<div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="noteLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="noteForm" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="noteLabel">Explain an Absence</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="absenceDate">Date of absence <span class="text-danger">*</span></label>
                            <input type="date" id="absenceDate" name="absenceDate" class="form-control" required />
                            <div class="invalid-feedback" data-server-feedback>Please choose the date.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="reason">Reason <span class="text-danger">*</span></label>
                            <textarea id="reason" name="reason" class="form-control" rows="4"
                                      maxlength="1000" required
                                      placeholder="Tell the school why the day was missed."></textarea>
                            <div class="invalid-feedback" data-server-feedback>Please give a reason.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveNoteBtn">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Review (teacher) -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="reviewForm" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="reviewLabel">Review Absence Note</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <dl class="row small mb-3">
                        <dt class="col-4 text-secondary">Student</dt>
                        <dd class="col-8" id="reviewStudent">&mdash;</dd>
                        <dt class="col-4 text-secondary">Date</dt>
                        <dd class="col-8" id="reviewDate">&mdash;</dd>
                        <dt class="col-4 text-secondary">Reason</dt>
                        <dd class="col-8" id="reviewReason">&mdash;</dd>
                    </dl>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="status">Decision <span class="text-danger">*</span></label>
                            <select id="status" name="status" class="form-select" required>
                                <option value="ACKNOWLEDGED">Acknowledge</option>
                                <option value="REJECTED">Reject</option>
                            </select>
                            <div class="invalid-feedback" data-server-feedback>Please choose a decision.</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="reviewNote">Note to the family</label>
                            <textarea id="reviewNote" name="reviewNote" class="form-control" rows="3"
                                      maxlength="500"></textarea>
                            <div class="invalid-feedback" data-server-feedback></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveReviewBtn">Save Decision</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/portal-shared.js}"></script>
<script th:src="@{/assets/js/pages/portal-absence-notes.js}"></script>

</body>
</html>
