<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Attendance')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: mobileNav}"></div>

<div id="content" class="position-relative h-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="custom-container">
        <div class="page-header">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard/index}" class="text-secondary">Dashboard</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Attendance</li>
                    </ol>
                </nav>
                <h1>Attendance</h1>
                <p class="page-subtitle" id="resultSummary">Loading...</p>
            </div>
        </div>

        <div class="table-toolbar" id="childPickerWrapper">
            <div class="toolbar-search">
                <label class="form-label small text-secondary mb-1" for="childPicker">Child</label>
                <select id="childPicker" class="form-select" aria-label="Choose a child"></select>
            </div>
            <div class="toolbar-spacer"></div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-primary-subtle text-primary-emphasis"><i class="ti ti-percentage"></i></span>
                        <div>
                            <p class="stat-label">Attendance rate</p>
                            <h3 class="stat-value" id="statRate">&mdash;</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-success-subtle text-success-emphasis"><i class="ti ti-check"></i></span>
                        <div>
                            <p class="stat-label">Present</p>
                            <h3 class="stat-value" id="statPresent">&mdash;</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-danger-subtle text-danger-emphasis"><i class="ti ti-x"></i></span>
                        <div>
                            <p class="stat-label">Absent</p>
                            <h3 class="stat-value" id="statAbsent">&mdash;</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center gap-3">
                        <span class="stat-icon bg-warning-subtle text-warning-emphasis"><i class="ti ti-clock"></i></span>
                        <div>
                            <p class="stat-label">Late</p>
                            <h3 class="stat-value" id="statLate">&mdash;</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table app-table mb-0 align-middle">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Class</th>
                            <th>Subject</th>
                            <th>Remarks</th>
                        </tr>
                        </thead>
                        <tbody id="tableBody">
                        <tr><td colspan="5" class="table-state"><i class="ti ti-loader-2"></i>Loading attendance...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/assets/js/pages/portal-shared.js}"></script>
<script th:src="@{/assets/js/pages/portal-my-attendance.js}"></script>

</body>
</html>
